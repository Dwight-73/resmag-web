<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Panel de Administración – RESMAG</title>
  <link rel="stylesheet" href="style.css">
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-analytics.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAA2ahN95a83qbe4uFSYvHCQWUiDRI9aWE",
      authDomain: "res-log-man.firebaseapp.com",
      databaseURL: "https://res-log-man-default-rtdb.firebaseio.com",
      projectId: "res-log-man",
      storageBucket: "res-log-man.firebasestorage.app",
      messagingSenderId: "822449215130",
      appId: "1:822449215130:web:af7144c5bdfccd97a53123",
      measurementId: "G-JXRX3VBWMX"
    };

    const app = initializeApp(firebaseConfig);
    try { getAnalytics(app); } catch {}
  </script>
</head>
<body class="pagina-admin transparent-header-page">

  <div class="barra-superior">
    <button class="nav-toggle" type="button" aria-label="Menú" aria-expanded="false">☰</button>
    <img src="images/LM1.png" alt="RESMAG REPAIRS SERVICES MAINTENANCE GROUP SAC" />
    <nav class="menu" id="site-menu">
      <a href="index.html" data-es="Inicio" data-en="Home" data-pt="Início">Inicio</a>
      <a href="servicios.html" data-es="Servicios" data-en="Services" data-pt="Serviços">Servicios</a>
      <a href="contactanos.html#cotizacion" data-es="Cotización" data-en="Quote" data-pt="Orçamento">Cotización</a>
      <select id="selector-idioma">
        <option value="es">🇪🇸 ES</option>
        <option value="en">🇺🇸 US</option>
        <option value="pt">🇧🇷 BR</option>
      </select>
      <span class="spacer"></span>
    </nav>
  </div>
  <div class="mobile-nav-overlay" aria-hidden="true"></div>

  <div class="auth-page" id="adminLogin" style="display:none">
    <div class="auth-shell" style="max-width: 920px">
      <div class="auth-showcase">
        <div class="auth-showcase-card">
          <div class="auth-badge">RESMAG · Admin</div>
          <h1>Administración</h1>
          <p>Inicia sesión para ver cotizaciones y descargar el CSV.</p>
        </div>
      </div>
      <div class="auth-surface">
        <div class="auth-card">
          <h2>Iniciar sesión</h2>
          <p class="auth-subtitle">Acceso solo para administradores.</p>
          <div id="adminLoginError" class="auth-note error" style="display:none"></div>
          <form id="adminLoginForm" class="auth-form">
            <div class="auth-field">
              <label for="adminEmail">Correo</label>
              <input id="adminEmail" name="correo" type="email" required placeholder="admin@resmag.local" autocomplete="username">
            </div>
            <div class="auth-field">
              <label for="adminPassword">Contraseña</label>
              <input id="adminPassword" name="password" type="password" required placeholder="••••••••" autocomplete="current-password">
            </div>
            <button type="submit" class="auth-submit">Entrar</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div id="adminApp" style="display:none">
    <div class="contenido">
      <h2 data-es="Panel de Administración" data-en="Admin Panel" data-pt="Painel de Administração">Panel de Administración</h2>
      <div class="admin-header-actions">
        <div class="admin-search">
          <input id="searchInput" type="text" placeholder="Buscar por nombre, empresa, correo o servicio">
        </div>
        <a id="downloadCsvBtn" class="btn-cotizar" href="#"
           data-es="Descargar CSV" data-en="Download CSV" data-pt="Baixar CSV">Descargar CSV</a>
        <button id="refreshBtn">Actualizar</button>
      </div>
    </div>

    <div class="contenido">
      <div class="admin-cards">
        <section class="admin-card">
          <h3 data-es="Solicitudes de Cotización" data-en="Quote Requests" data-pt="Solicitações de Orçamento">Solicitudes de Cotización</h3>
          <div class="admin-table-wrapper">
            <table class="admin-table" id="quotesTable">
              <thead>
                <tr>
                  <th data-es="Fecha" data-en="Date" data-pt="Data">Fecha</th>
                  <th data-es="Nombre" data-en="Name" data-pt="Nome">Nombre</th>
                  <th data-es="Empresa" data-en="Company" data-pt="Empresa">Empresa</th>
                  <th>Email</th>
                  <th data-es="Teléfono" data-en="Phone" data-pt="Telefone">Teléfono</th>
                  <th data-es="Servicio" data-en="Service" data-pt="Serviço">Servicio</th>
                  <th data-es="Mensaje" data-en="Message" data-pt="Mensagem">Mensaje</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
            <div class="admin-empty" id="quotesEmpty">Sin datos</div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script type="module">
    import { getApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { getFirestore, collection, query, orderBy, getDocs, where, limit } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const API_QUOTES = 'http://localhost/res-log-man/api/quotes.php';
    const API_QUOTES_CSV = 'http://localhost/res-log-man/api/quotes-csv.php';
    const API_SESSION = 'http://localhost/res-log-man/api/session.php';
    const API_LOGIN = 'http://localhost/res-log-man/api/login.php';

    const isHosted = /\.web\.app$|\.firebaseapp\.com$/i.test(window.location.hostname);
    const quotesTbody = document.querySelector('#quotesTable tbody');
    const quotesEmpty = document.getElementById('quotesEmpty');
    const searchInput = document.getElementById('searchInput');
    const refreshBtn = document.getElementById('refreshBtn');
    const downloadCsvBtn = document.getElementById('downloadCsvBtn');
    const adminLogin = document.getElementById('adminLogin');
    const adminLoginForm = document.getElementById('adminLoginForm');
    const adminLoginError = document.getElementById('adminLoginError');
    const adminApp = document.getElementById('adminApp');

    let quotesData = [];

    const norm = (s) => (s ?? '').toString().toLowerCase();
    const isAdminRole = (role) => ['admin', 'administrador', 'administrator', 'superadmin', 'root'].includes(norm(role).trim());

    function showLogin(message) {
      if (adminApp) adminApp.style.display = 'none';
      if (adminLogin) adminLogin.style.display = '';
      if (adminLoginError) {
        if (message) {
          adminLoginError.textContent = message;
          adminLoginError.style.display = '';
        } else {
          adminLoginError.textContent = '';
          adminLoginError.style.display = 'none';
        }
      }
    }

    function showApp() {
      if (adminLogin) adminLogin.style.display = 'none';
      if (adminApp) adminApp.style.display = '';
    }

    function formatDate(value) {
      try {
        if (value && typeof value.toDate === 'function') {
          return value.toDate().toLocaleString();
        }
        if (typeof value === 'string' && value.trim()) {
          const d = new Date(value);
          if (!Number.isNaN(d.getTime())) return d.toLocaleString();
          return value;
        }
        return '';
      } catch {
        return '';
      }
    }

    function renderQuotes(rows) {
      quotesTbody.innerHTML = '';
      if (!rows.length) { quotesEmpty.style.display = 'block'; return; }
      quotesEmpty.style.display = 'none';
      rows.forEach(r => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${formatDate(r.createdAt ?? r.fecha ?? r.created_at)}</td>
          <td>${r.nombre || r.full_name || ''}</td>
          <td>${r.empresa || ''}</td>
          <td>${r.email || ''}</td>
          <td>${r.telefono || r.phone || ''}</td>
          <td>${r.servicio || r.service || ''}</td>
          <td>${r.mensaje || r.message || ''}</td>
        `;
        quotesTbody.appendChild(tr);
      });
    }

    function getFilteredRows() {
      const q = norm(searchInput?.value || '');
      if (!q) return quotesData.slice();
      return quotesData.filter(r =>
        norm(r.nombre).includes(q) ||
        norm(r.empresa).includes(q) ||
        norm(r.email).includes(q) ||
        norm(r.servicio).includes(q) ||
        norm(r.mensaje).includes(q)
      );
    }

    function applyFilter() {
      renderQuotes(getFilteredRows());
    }

    function downloadCsv(rows) {
      const sep = ';';
      const escapeField = (value) => {
        const s = (value ?? '').toString();
        if (/[;"\r\n]/.test(s)) return `"${s.replace(/"/g, '""')}"`;
        return s;
      };
      const header = ['id', 'created_at', 'nombre', 'empresa', 'email', 'telefono', 'servicio', 'mensaje', 'estado'];
      const lines = [
        `sep=${sep}`,
        header.join(sep),
        ...rows.map((r) => ([
          escapeField(r.id || ''),
          escapeField(formatDate(r.createdAt ?? r.fecha ?? r.created_at)),
          escapeField(r.nombre || ''),
          escapeField(r.empresa || ''),
          escapeField(r.email || ''),
          escapeField(r.telefono || ''),
          escapeField(r.servicio || ''),
          escapeField(r.mensaje || ''),
          escapeField(r.estado || ''),
        ]).join(sep))
      ].join('\n');

      const blob = new Blob([lines], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'cotizaciones.csv';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    async function fetchRowsPhp(url) {
      try {
        const res = await fetch(url, { credentials: 'include' });
        if (res.status === 401) return [];
        if (!res.ok) return [];
        const data = await res.json();
        if (Array.isArray(data)) return data;
        if (data && Array.isArray(data.cotizaciones)) return data.cotizaciones;
        if (data && Array.isArray(data.rows)) return data.rows;
        return [];
      } catch {
        return [];
      }
    }

    async function checkAdminPhp() {
      try {
        const res = await fetch(API_SESSION, { credentials: 'include' });
        if (!res.ok) return false;
        const s = await res.json();
        const rol = (s && (s.rol || (s.user && s.user.role) || '')).toString();
        return rol === 'admin';
      } catch {
        return false;
      }
    }

    async function loadDataPhp() {
      quotesData = await fetchRowsPhp(API_QUOTES);
      applyFilter();
    }

    async function initHosted() {
      const app = getApp();
      const auth = getAuth(app);
      const db = getFirestore(app);

      const checkAdminFirestoreByEmail = async (email) => {
        const q = query(collection(db, 'usuarios'), where('correo', '==', email), limit(1));
        const snap = await getDocs(q);
        if (snap.empty) return false;
        const data = snap.docs[0].data() || {};
        return isAdminRole(data.rol);
      };

      const loadDataFirestore = async () => {
        try {
          const q = query(collection(db, 'cotizaciones'), orderBy('createdAt', 'desc'));
          const snap = await getDocs(q);
          quotesData = snap.docs.map((d) => ({ id: d.id, ...(d.data() || {}) }));
        } catch {
          const snap = await getDocs(collection(db, 'cotizaciones'));
          quotesData = snap.docs.map((d) => ({ id: d.id, ...(d.data() || {}) }));
        }
        applyFilter();
      };

      if (refreshBtn) refreshBtn.addEventListener('click', loadDataFirestore);
      if (searchInput) searchInput.addEventListener('input', applyFilter);
      if (downloadCsvBtn) {
        downloadCsvBtn.addEventListener('click', (event) => {
          event.preventDefault();
          downloadCsv(getFilteredRows());
        });
      }

      if (adminLoginForm) {
        adminLoginForm.addEventListener('submit', async (event) => {
          event.preventDefault();
          if (!adminLoginForm.reportValidity()) return;
          const email = (adminLoginForm.querySelector('#adminEmail')?.value || '').trim();
          const pass = (adminLoginForm.querySelector('#adminPassword')?.value || '').trim();
          try {
            await signInWithEmailAndPassword(auth, email, pass);
          } catch {
            showLogin('No se pudo iniciar sesión');
          }
        });
      }

      onAuthStateChanged(auth, async (user) => {
        if (!user || !user.email) {
          showLogin();
          return;
        }
        const ok = await checkAdminFirestoreByEmail(user.email).catch(() => false);
        if (!ok) {
          try { await signOut(auth); } catch {}
          showLogin('Acceso denegado');
          return;
        }
        showApp();
        loadDataFirestore();
      });
    }

    async function initLocal() {
      if (searchInput) searchInput.addEventListener('input', applyFilter);
      if (refreshBtn) refreshBtn.addEventListener('click', loadDataPhp);
      if (downloadCsvBtn) {
        downloadCsvBtn.href = API_QUOTES_CSV;
        downloadCsvBtn.target = '_blank';
        downloadCsvBtn.rel = 'noopener noreferrer';
        downloadCsvBtn.addEventListener('click', async (event) => {
          const ok = await checkAdminPhp();
          if (!ok) {
            event.preventDefault();
            showLogin('Inicia sesión como administrador para descargar el CSV.');
          }
        });
      }

      const ok = await checkAdminPhp();
      if (ok) {
        showApp();
        loadDataPhp();
        return;
      }
      showLogin();
      if (adminLoginForm) {
        adminLoginForm.addEventListener('submit', async (event) => {
          event.preventDefault();
          if (!adminLoginForm.reportValidity()) return;
          try {
            const res = await fetch(API_LOGIN, {
              method: 'POST',
              credentials: 'include',
              body: new FormData(adminLoginForm)
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok || !data.ok) {
              showLogin((data && data.error) ? data.error : 'No se pudo iniciar sesión');
              return;
            }
            if ((data.rol || '').toString() !== 'admin') {
              showLogin('Acceso denegado');
              return;
            }
            showApp();
            loadDataPhp();
          } catch {
            showLogin('No se pudo iniciar sesión');
          }
        });
      }
    }

    function initNav() {
      const body = document.body;
      const toggle = document.querySelector('.nav-toggle');
      const overlay = document.querySelector('.mobile-nav-overlay');
      const menu = document.querySelector('.menu');

      if (!toggle || !overlay || !menu) return;

      const close = () => {
        body.classList.remove('nav-open');
        toggle.setAttribute('aria-expanded', 'false');
      };

      const open = () => {
        body.classList.add('nav-open');
        toggle.setAttribute('aria-expanded', 'true');
      };

      toggle.addEventListener('click', () => {
        if (body.classList.contains('nav-open')) {
          close();
          return;
        }
        open();
      });

      overlay.addEventListener('click', close);

      menu.addEventListener('click', (event) => {
        const target = event.target;
        if (!(target instanceof Element)) return;
        if (target.closest('a')) close();
      });

      window.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') close();
      });

      window.addEventListener('resize', () => {
        if (window.innerWidth > 768) close();
      });
    }

    document.addEventListener('DOMContentLoaded', async () => {
      initNav();
      if (window.location.protocol === 'file:') {
        const target = 'http://localhost/resmag-web/admin.html';
        try { window.location.replace(target); } catch {}
        showLogin('Abre esta página desde http://localhost/resmag-web/admin.html (no desde file://)');
        return;
      }
      if (isHosted) {
        await initHosted();
      } else {
        await initLocal();
      }
    });
  </script>
</body>
</html>
