<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1200 1200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="1200" fill="#ffffff"/>

  <rect x="60" y="265" width="290" height="170" rx="12" fill="#b7d7a8" stroke="#6b8f4e" stroke-width="3"/>
  <text x="205" y="330" font-family="Arial, sans-serif" font-size="38" fill="#1f2937" font-weight="800" text-anchor="middle">DOP mejorado</text>
  <text x="205" y="392" font-family="Arial, sans-serif" font-size="48" fill="#1f2937" font-weight="900" text-anchor="middle">30 min</text>

  <text x="430" y="95" font-family="Arial, sans-serif" font-size="20" fill="#111827" font-weight="700">Inicio</text>
  <text x="520" y="1160" font-family="Arial, sans-serif" font-size="20" fill="#111827" font-weight="700" text-anchor="middle">Fin</text>

  <line x1="520" y1="902" x2="520" y2="1110" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>

  <g>
    <circle cx="520" cy="130" r="26" fill="#ffffff" stroke="#4d7c0f" stroke-width="4"/>
    <text x="520" y="138" font-family="Arial, sans-serif" font-size="18" fill="#111827" font-weight="800" text-anchor="middle">1</text>
    <line x1="520" y1="156" x2="520" y2="198" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="600" y="138" font-family="Arial, sans-serif" font-size="20" fill="#111827">El cliente solicita servicio (RESMAG) (5 min)</text>

    <rect x="494" y="200" width="52" height="52" fill="#ffffff" stroke="#4d7c0f" stroke-width="4"/>
    <text x="520" y="233" font-family="Arial, sans-serif" font-size="18" fill="#111827" font-weight="800" text-anchor="middle">2</text>
    <line x1="520" y1="252" x2="520" y2="314" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="600" y="233" font-family="Arial, sans-serif" font-size="20" fill="#111827">Vendedora verifica disponibilidad (2 min)</text>

    <circle cx="520" cy="340" r="26" fill="#ffffff" stroke="#4d7c0f" stroke-width="4"/>
    <text x="520" y="348" font-family="Arial, sans-serif" font-size="18" fill="#111827" font-weight="800" text-anchor="middle">3</text>
    <line x1="520" y1="366" x2="520" y2="430" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="600" y="348" font-family="Arial, sans-serif" font-size="20" fill="#111827">Vendedora crea y envía cotización (8 min)</text>

    <circle cx="520" cy="456" r="26" fill="#ffffff" stroke="#4d7c0f" stroke-width="4"/>
    <text x="520" y="464" font-family="Arial, sans-serif" font-size="18" fill="#111827" font-weight="800" text-anchor="middle">4</text>
    <line x1="520" y1="482" x2="520" y2="550" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="600" y="456" font-family="Arial, sans-serif" font-size="20" fill="#111827">
      <tspan x="600" dy="0">Vendedora recibe orden de compra y el pago parcial</tspan>
      <tspan x="600" dy="24">(2 min)</tspan>
    </text>

    <circle cx="520" cy="576" r="26" fill="#ffffff" stroke="#4d7c0f" stroke-width="4"/>
    <text x="520" y="584" font-family="Arial, sans-serif" font-size="18" fill="#111827" font-weight="800" text-anchor="middle">5</text>
    <line x1="520" y1="602" x2="520" y2="700" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="600" y="576" font-family="Arial, sans-serif" font-size="20" fill="#111827">
      <tspan x="600" dy="0">Vendedora informa orden de compra y pago a</tspan>
      <tspan x="600" dy="24">Administración (3 min)</tspan>
    </text>

    <circle cx="520" cy="726" r="26" fill="#ffffff" stroke="#4d7c0f" stroke-width="4"/>
    <text x="520" y="734" font-family="Arial, sans-serif" font-size="18" fill="#111827" font-weight="800" text-anchor="middle">6</text>
    <line x1="520" y1="752" x2="520" y2="850" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="600" y="726" font-family="Arial, sans-serif" font-size="20" fill="#111827">
      <tspan x="600" dy="0">Administradora actualiza estado de cuenta del cliente.</tspan>
      <tspan x="600" dy="24">(5 min)</tspan>
    </text>

    <circle cx="520" cy="876" r="26" fill="#ffffff" stroke="#4d7c0f" stroke-width="4"/>
    <text x="520" y="884" font-family="Arial, sans-serif" font-size="18" fill="#111827" font-weight="800" text-anchor="middle">7</text>
    <text x="600" y="876" font-family="Arial, sans-serif" font-size="20" fill="#111827">
      <tspan x="600" dy="0">Administradora crea una factura y envía por correo</tspan>
      <tspan x="600" dy="24">(5 min)</tspan>
    </text>
  </g>
</svg>
